<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>KISAAN AI | Precision Farming</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0a0e0a;
      --card: #111611;
      --card2: #141a14;
      --border: #1e2a1e;
      --green: #4ade80;
      --green2: #22c55e;
      --green3: #16a34a;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #38bdf8;
      --text: #e8f5e8;
      --muted: #5a7a5a;
      --muted2: #3a503a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden
    }

    /* ── SPLASH ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease
    }

    #splash.out {
      opacity: 0;
      pointer-events: none
    }

    .sp-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.03em;
      opacity: 0;
      animation: spIn 0.8s ease 0.4s forwards
    }

    .sp-sub {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0;
      animation: spIn 0.8s ease 0.9s forwards;
      margin-top: 0.5rem
    }

    .sp-track {
      width: 180px;
      height: 2px;
      background: #1a261a;
      margin-top: 2.5rem;
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: spIn 0.4s ease 1.3s forwards
    }

    .sp-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--green3), var(--green));
      animation: spBar 1.6s ease 1.3s forwards
    }

    .sp-dots {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none
    }

    .sp-dot {
      position: absolute;
      border-radius: 50%;
      background: var(--green);
      opacity: 0;
      animation: spDot var(--d) ease var(--dl) infinite
    }

    @keyframes spIn {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes spBar {
      to {
        width: 100%
      }
    }

    @keyframes spDot {
      0% {
        transform: translateY(-10px);
        opacity: 0
      }

      15% {
        opacity: 0.5
      }

      85% {
        opacity: 0.15
      }

      100% {
        transform: translateY(100vh);
        opacity: 0
      }
    }

    /* ── AUTH SCREEN ── */
    #auth-wrap {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: flex-end;
      padding: 2rem
    }

    #auth-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=1920&q=80');
      background-size: cover;
      background-position: center
    }

    #auth-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(5, 10, 5, 0.85) 0%, rgba(10, 20, 10, 0.6) 100%)
    }

    .auth-left {
      position: absolute;
      left: 4rem;
      top: 50%;
      transform: translateY(-50%)
    }

    .auth-left h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 700;
      color: white;
      line-height: 0.95;
      letter-spacing: -0.04em
    }

    .auth-left h1 span {
      color: var(--green)
    }

    .auth-left p {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.9rem;
      margin-top: 1rem;
      max-width: 380px;
      line-height: 1.6
    }

    .auth-card {
      background: rgba(10, 14, 10, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      animation: cardIn 0.7s ease forwards;
      opacity: 0
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateX(20px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    .auth-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.75rem;
      background: #0d120d;
      border-radius: 0.6rem;
      padding: 3px
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0.45rem;
      transition: all 0.2s
    }

    .auth-tab.on {
      background: var(--card2);
      color: var(--green);
      border: 1px solid var(--border)
    }

    .auth-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 0.4rem
    }

    .auth-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0d120d;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 1rem
    }

    .auth-input:focus {
      border-color: var(--green3);
      background: #0f150f
    }

    .auth-input::placeholder {
      color: var(--muted)
    }

    .auth-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--green3);
      border: none;
      border-radius: 0.6rem;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s
    }

    .auth-btn:hover:not(:disabled) {
      background: var(--green2)
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed
    }

    .auth-btn.sec {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text)
    }

    .auth-btn.sec:hover:not(:disabled) {
      border-color: var(--green);
      color: var(--green)
    }

    .auth-msg {
      padding: 0.65rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.72rem;
      margin-bottom: 1rem;
      display: none
    }

    .auth-msg.err {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444
    }

    .auth-msg.ok {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--green)
    }

    /* ── MAIN APP ── */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100vh
    }

    /* NAV */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
      background: rgba(10, 14, 10, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px)
    }

    .nav-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.4rem
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative
    }

    /* Notification bell */
    .notif-wrap {
      position: relative
    }

    .notif-btn {
      width: 36px;
      height: 36px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      position: relative;
      transition: all 0.2s
    }

    .notif-btn:hover {
      border-color: var(--green);
      background: rgba(74, 222, 128, 0.08)
    }

    .notif-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      border: 1px solid var(--bg);
      display: none
    }

    .notif-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 340px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      overflow: hidden
    }

    .notif-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .notif-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text)
    }

    .notif-clear {
      font-size: 0.65rem;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s
    }

    .notif-clear:hover {
      color: var(--green)
    }

    .notif-list {
      max-height: 320px;
      overflow-y: auto
    }

    .notif-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.2s;
      cursor: pointer
    }

    .notif-item:hover {
      background: var(--card2)
    }

    .notif-item:last-child {
      border-bottom: none
    }

    .notif-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0
    }

    .notif-body {
      flex: 1
    }

    .notif-msg-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem
    }

    .notif-msg-text {
      font-size: 0.67rem;
      color: var(--muted);
      line-height: 1.3
    }

    .notif-time {
      font-size: 0.6rem;
      color: var(--muted2);
      margin-top: 0.2rem
    }

    .notif-empty {
      padding: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted)
    }

    /* Profile dropdown */
    .profile-wrap {
      position: relative
    }

    .profile-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.3rem 0.75rem 0.3rem 0.3rem;
      cursor: pointer;
      transition: all 0.2s
    }

    .profile-btn:hover {
      border-color: var(--green)
    }

    .profile-avatar {
      width: 28px;
      height: 28px;
      background: var(--green3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: white;
      overflow: hidden;
      flex-shrink: 0
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .profile-initials {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .profile-chevron {
      font-size: 0.6rem;
      color: var(--muted);
      transition: transform 0.2s
    }

    .profile-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 240px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      overflow: hidden
    }

    .pd-header {
      padding: 1.1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem
    }

    .pd-avatar-lg {
      width: 40px;
      height: 40px;
      background: var(--green3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      overflow: hidden;
      flex-shrink: 0
    }

    .pd-avatar-lg img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .pd-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .pd-email {
      font-size: 0.65rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .pd-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.78rem;
      color: var(--text);
      border: none;
      background: none;
      width: 100%;
      text-align: left
    }

    .pd-item:hover {
      background: var(--card2)
    }

    .pd-item.danger:hover {
      background: rgba(239, 68, 68, 0.08);
      color: var(--red)
    }

    .pd-divider {
      height: 1px;
      background: var(--border);
      margin: 0.25rem 0
    }

    .pd-icon {
      font-size: 0.9rem;
      width: 20px;
      text-align: center
    }

    /* Profile modal */
    .profile-modal-bg {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center
    }

    .profile-modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      margin: 1rem
    }

    .pm-avatar-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem
    }

    .pm-avatar {
      width: 80px;
      height: 80px;
      background: var(--green3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      overflow: hidden
    }

    .pm-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .pm-upload {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 28px;
      height: 28px;
      background: var(--green3);
      border: 2px solid var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s
    }

    .pm-upload:hover {
      background: var(--green2)
    }

    /* HERO */
    .hero {
      position: relative;
      height: 260px;
      overflow: hidden;
      border-bottom: 1px solid var(--border)
    }

    .hero-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: all 0.8s ease;
      filter: brightness(0.45)
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 10, 5, 0.95) 0%, rgba(5, 10, 5, 0.4) 60%, transparent 100%)
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 2.5rem 2.5rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start
    }

    .hero-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 0.75rem;
      font-weight: 500
    }

    .hero-crop {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      color: white;
      line-height: 0.9;
      letter-spacing: -0.03em;
      transition: all 0.5s
    }

    .hero-sub {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap
    }

    .hero-sub span {
      color: rgba(255, 255, 255, 0.7)
    }

    .hero-cta {
      margin-top: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--green3);
      border: none;
      border-radius: 0.5rem;
      padding: 0.6rem 1.25rem;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: auto;
      align-self: flex-start
    }

    .hero-cta:hover {
      background: var(--green2);
      transform: translateY(-1px)
    }

    .hero-badge {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(10, 14, 10, 0.8);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      backdrop-filter: blur(12px)
    }

    .hero-badge-label {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem
    }

    .hero-badge-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green)
    }

    /* STATUS BAR */
    .status-bar {
      padding: 0.3rem 2rem;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      background: rgba(22, 163, 74, 0.08);
      border-bottom: 1px solid rgba(22, 163, 74, 0.15);
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 0.5rem
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    /* SECTION LABEL */
    .sec-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.6rem
    }

    .sec-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .sec-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%
    }

    /* SENSOR CARDS */
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 1px;
      background: var(--border)
    }

    .sensor-card {
      background: var(--card);
      padding: 1.1rem 1rem;
      position: relative;
      overflow: hidden;
      transition: background 0.2s;
      height: 220px;
      display: flex;
      flex-direction: column
    }

    .sensor-card:hover {
      background: var(--card2)
    }

    .sc-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem
    }

    .sc-icon {
      width: 32px;
      height: 32px;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem
    }

    .sc-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .sc-arrow {
      font-size: 0.7rem;
      color: var(--muted)
    }

    .sc-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      line-height: 1;
      margin-bottom: 0.15rem;
      margin-top: 0.5rem
    }

    .sc-unit {
      font-size: 0.65rem;
      color: var(--muted);
      margin-bottom: 0.5rem
    }

    .sc-chart {
      height: 65px;
      width: 100%;
      display: block;
      margin-top: auto
    }

    .sc-trend {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 3px
    }

    .trend-up {
      background: rgba(74, 222, 128, 0.12);
      color: var(--green)
    }

    .trend-down {
      background: rgba(239, 68, 68, 0.12);
      color: var(--red)
    }

    .trend-warn {
      background: rgba(234, 179, 8, 0.12);
      color: var(--yellow)
    }

    /* AI CARDS */
    .ai-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem
    }

    .ai-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      position: relative;
      overflow: hidden
    }

    .ai-card-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase
    }

    .badge-green {
      background: rgba(74, 222, 128, 0.12);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, 0.2)
    }

    .badge-red {
      background: rgba(239, 68, 68, 0.12);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.2)
    }

    .badge-yellow {
      background: rgba(234, 179, 8, 0.12);
      color: var(--yellow);
      border: 1px solid rgba(234, 179, 8, 0.2)
    }

    .badge-blue {
      background: rgba(56, 189, 248, 0.12);
      color: var(--blue);
      border: 1px solid rgba(56, 189, 248, 0.2)
    }

    .ai-big {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      line-height: 1
    }

    .ai-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.35rem
    }

    .conf-bar-bg {
      background: #1a261a;
      border-radius: 99px;
      height: 4px;
      margin-top: 1rem
    }

    .conf-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s ease
    }

    /* BOTTOM GRID */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 380px;
      gap: 1rem
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .chart-wrap {
      height: 220px
    }

    /* FEED */
    .feed-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border)
    }

    .feed-item:last-child {
      border-bottom: none
    }

    .feed-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0
    }

    .feed-body {
      flex: 1
    }

    .feed-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem
    }

    .feed-msg {
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.4
    }

    .feed-time {
      font-size: 0.6rem;
      color: var(--muted2);
      margin-top: 0.2rem
    }

    /* SETTINGS MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      margin: 1rem;
      max-height: 90vh;
      overflow-y: auto
    }

    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem
    }

    .modal-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 1.5rem
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem
    }

    .form-group {
      margin-bottom: 0.75rem
    }

    .form-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 0.4rem
    }

    .form-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: #0d120d;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif
    }

    .form-input:focus {
      border-color: var(--green3)
    }

    .form-input::placeholder {
      color: var(--muted)
    }

    select.form-input option {
      background: var(--card)
    }

    .save-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--green3);
      border: none;
      border-radius: 0.6rem;
      color: white;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s
    }

    .save-btn:hover {
      background: var(--green2)
    }
